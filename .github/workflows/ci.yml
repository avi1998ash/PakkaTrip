name: CI

on:
  pull_request:
    branches: [develop, main, "release/**", "hotfix/**"]
  push:
    branches: [develop, main, "release/**", "hotfix/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pakkatrip
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: pakkatrip
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pakkatrip"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DJANGO_DEBUG: "False"
      DB_NAME: pakkatrip
      DB_USER: pakkatrip
      DB_PASSWORD: ci-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test api --noinput

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
