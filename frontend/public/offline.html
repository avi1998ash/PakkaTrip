<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B2E59" />
  <title>You're offline — PakkaTrip</title>
  <style>
    body {margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
      background: #F4F6FA; color: #172233; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center;}
    .card {max-width: 340px;}
    img {width: 72px; height: 72px; border-radius: 16px;}
    h1 {font-size: 20px; margin: 18px 0 8px;}
    p {color: #5F6B7D; line-height: 1.5; margin: 0 0 20px;}
    button {background: #F28C28; color: #fff; border: 0; border-radius: 10px; padding: 12px 22px; font-size: 15px; font-weight: 600;}
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/public-192.png" alt="" />
    <h1>You're offline</h1>
    <p>PakkaTrip needs internet to show live prices, seats and bookings. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
